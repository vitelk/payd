  <text x="164" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="600"
        letter-spacing="-0.8" fill="#eeebe3">Payd<tspan dx="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17"
        font-weight="500" letter-spacing="6.5" fill="#ccff00">PROTOCOL</tspan></text>

  <text x="64" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600"
        letter-spacing="-0.6" fill="#eeebe3">One key, or<tspan dx="12" fill="#ccff00">no key at all.</tspan></text>
  <text x="64" y="218" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="1.3" fill="#97917f">WHO CAN REPLACE THE CODE AFTER YOUR LAUNCH</text>

  <rect x="64" y="252" width="516" height="300" fill="#1b1a15"/>
  <text x="88" y="290" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" letter-spacing="1.2" fill="#97917f">PONSVAULT &#8212; A SHARED BEACON</text>
  <rect x="238" y="324" width="168" height="44" fill="none" stroke="#97917f" stroke-width="2"/>
  <text x="322" y="352" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="1.2" fill="#97917f">BEACON OWNER</text>
