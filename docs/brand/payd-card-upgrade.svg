  <path d="M 322 368 L 322 396 L 524 396 L 524 424" fill="none" stroke="#97917f" stroke-width="1.5"/>
  <path d="M 518 416 L 524 424 L 530 416" fill="none" stroke="#97917f" stroke-width="1.5"/>
  <rect x="124" y="424" width="80" height="54" fill="none" stroke="#97917f" stroke-width="2"/>
  <text x="164" y="457" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1" fill="#eeebe3">VAULT</text>
  <rect x="244" y="424" width="80" height="54" fill="none" stroke="#97917f" stroke-width="2"/>
  <text x="284" y="457" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1" fill="#eeebe3">VAULT</text>
  <rect x="364" y="424" width="80" height="54" fill="none" stroke="#97917f" stroke-width="2"/>
  <text x="404" y="457" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1" fill="#eeebe3">VAULT</text>
  <rect x="484" y="424" width="80" height="54" fill="none" stroke="#97917f" stroke-width="2"/>
  <text x="524" y="457" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1" fill="#eeebe3">VAULT</text>
  <text x="88" y="522" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#97917f">One owner replaces the code inside every live</text>
  <text x="88" y="542" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#97917f">vault at once. Renouncing it is possible, not done.</text>

  <rect x="620" y="252" width="516" height="300" fill="#1b1a15"/>
  <text x="644" y="290" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" letter-spacing="1.2" fill="#ccff00">PAYD &#8212; IMMUTABLE CLONES</text>
  <rect x="794" y="324" width="168" height="44" fill="none" stroke="#2c2a24" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="878" y="352" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="1.2" fill="#2c2a24">NO OWNER</text>
  <text x="878" y="404" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1.2" fill="#ccff00">NOTHING POINTS AT THEM</text>
  <rect x="680" y="424" width="80" height="54" fill="none" stroke="#ccff00" stroke-width="2"/>
  <text x="720" y="457" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1" fill="#eeebe3">VAULT</text>
  <rect x="800" y="424" width="80" height="54" fill="none" stroke="#ccff00" stroke-width="2"/>
  <text x="840" y="457" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1" fill="#eeebe3">VAULT</text>
  <rect x="920" y="424" width="80" height="54" fill="none" stroke="#ccff00" stroke-width="2"/>
  <text x="960" y="457" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1" fill="#eeebe3">VAULT</text>
  <rect x="1040" y="424" width="80" height="54" fill="none" stroke="#ccff00" stroke-width="2"/>
  <text x="1080" y="457" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1" fill="#eeebe3">VAULT</text>
  <text x="644" y="522" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#eeebe3">Each vault is its own bytecode, for ever. Nobody</text>
  <text x="644" y="542" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#eeebe3">can replace it — us included. That is the trade.</text>

