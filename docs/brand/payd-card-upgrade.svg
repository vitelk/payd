<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="Who can replace the code after your launch. On the left, PonsVault: every vault points at one shared beacon, so the beacon's owner replaces the code inside all of them at once, and renouncing that power is possible but not done. On the right, Payd: each vault is an immutable clone of a fixed implementation with no proxy and no owner, so nobody can replace its code, Payd included. The only exit is migrate, one vault at a time, under a 48-hour timelock, refusing a destination of another mode.">
  <rect width="1200" height="630" fill="#14130f"/>

