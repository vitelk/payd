<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="Where the creator fee goes: Payd pays every holder in tokenised equities on a time-weighted snapshot, 10 percent platform fee capped at 15 percent in the bytecode, five payout shapes, no owner and no admin withdrawal. Pear pays holders too, takes 20 percent, snapshots whoever holds when a round fires, one payout shape, names no contract. Pump.fun sends the fee to the creator's wallet.">
  <rect width="1200" height="630" fill="#14130f"/>

  <!-- the mark, from docs/brand/payd-mark-dark.svg, height 112, ink top-left at (64,40) -->
