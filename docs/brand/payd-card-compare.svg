  <text x="164" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="600"
        letter-spacing="-0.8" fill="#eeebe3">Payd<tspan dx="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17"
        font-weight="500" letter-spacing="6.5" fill="#ccff00">PROTOCOL</tspan></text>

    <text x="64" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600"
        letter-spacing="-0.6" fill="#eeebe3">Where the fee<tspan dx="12" fill="#ccff00">actually goes.</tspan></text>
  <text x="64" y="222" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="1.3" fill="#97917f">ROBINHOOD CHAIN &#183; EVERY LAUNCH THAT TURNS ITS OWN FEE INTO ASSETS FOR ITS HOLDERS</text>

  <rect x="304" y="240" width="212" height="350" fill="#1b1a15"/>
  <text x="320" y="268" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" font-weight="500" letter-spacing="1.5" fill="#ccff00">PAYD</text>
  <text x="530" y="268" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" font-weight="500" letter-spacing="1.5" fill="#97917f">PEAR</text>
  <text x="740" y="268" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" font-weight="500" letter-spacing="1.5" fill="#97917f">FLAP</text>
  <text x="950" y="268" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" font-weight="500" letter-spacing="1.5" fill="#97917f">TORO</text>
  <path d="M64 282 H1136" stroke="#2c2a24" stroke-width="1"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#eeebe3">
    <text x="64" y="318" font-size="16" fill="#97917f">Where the fee comes from</text>
    <text x="320" y="318">The Pons creator fee —</text>
    <text x="320" y="338">the token is untaxed.</text>
    <text x="530" y="318">The Pons creator fee.</text>
    <text x="740" y="318">A buy/sell tax written</text>
    <text x="740" y="338">into the token.</text>
    <text x="950" y="318">A 3 % trade tax.</text>

    <text x="64" y="378" font-size="16" fill="#97917f">Platform take</text>
    <text x="320" y="378">10 %, and the bytecode</text>
    <text x="320" y="398">cannot go past 15 %.</text>
    <text x="530" y="378">20 %, to $PEAR</text>
    <text x="530" y="398">holders.</text>
    <text x="740" y="378">6 % of the tax, per</text>
    <text x="740" y="398">the vault spec.</text>
    <text x="950" y="378">1 % trade fee; a fifth</text>
    <text x="950" y="398">of it burns $TORO.</text>

    <text x="64" y="438" font-size="16" fill="#97917f">How a share is counted</text>
    <text x="320" y="438">Time held, integrated</text>
    <text x="320" y="458">over a 30-min epoch.</text>
    <text x="530" y="438">Whoever holds when</text>
    <text x="530" y="458">a round fires.</text>
    <text x="740" y="438">Balance above a minimum,</text>
    <text x="740" y="458">plus an anti-farm delay.</text>
    <text x="950" y="438">Balance through the</text>
    <text x="950" y="458">distribution period.</text>

    <text x="64" y="498" font-size="16" fill="#97917f">Who can change the vault</text>
    <text x="320" y="498">Nobody. Immutable clone,</text>
    <text x="320" y="518">no proxy, no owner.</text>
    <text x="530" y="498">Not stated anywhere</text>
    <text x="530" y="518">on the site.</text>
    <text x="740" y="498">The Flap Guardian, via</text>
    <text x="740" y="518">a beacon upgrade.</text>
    <text x="950" y="498">Nobody: the splits are</text>
    <text x="950" y="518">constants, no setter.</text>

    <text x="64" y="558" font-size="16" fill="#97917f">Payout shapes</text>
    <text x="320" y="558">Five, all live, picked</text>
    <text x="320" y="578">at launch.</text>
    <text x="530" y="558">One.</text>
    <text x="740" y="558">Any vault — anyone</text>
    <text x="740" y="578">can deploy one.</text>
    <text x="950" y="558">Four sleeves, the</text>
    <text x="950" y="578">holder picks.</text>

  </g>

  <path d="M64 600 H1136" stroke="#2c2a24" stroke-width="1"/>

  <text x="64" y="622" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#ccff00">paydprotocol.eth</text>
  <text x="1136" y="622" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13"
        letter-spacing="1.1" fill="#97917f">EACH COLUMN READ FROM ITS OWN SITE OR DOCS, 27 SEP 2026</text>
</svg>
