  <text x="164" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="600"
        letter-spacing="-0.8" fill="#eeebe3">Payd<tspan dx="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17"
        font-weight="500" letter-spacing="6.5" fill="#ccff00">PROTOCOL</tspan></text>

  <text x="64" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600"
        letter-spacing="-0.6" fill="#eeebe3">Same shelf.<tspan dx="12" fill="#ccff00">Different guarantees.</tspan></text>
  <text x="64" y="218" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="1.3" fill="#97917f">PAYD PROTOCOL AGAINST PONSVAULT &#183; ROBINHOOD CHAIN</text>

  <rect x="440" y="236" width="330" height="348" fill="#1b1a15"/>
  <text x="456" y="264" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" font-weight="500" letter-spacing="1.5" fill="#ccff00">PAYD</text>
  <text x="820" y="264" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" font-weight="500" letter-spacing="1.5" fill="#97917f">PONSVAULT</text>
  <path d="M64 278 H1136" stroke="#2c2a24" stroke-width="1"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#eeebe3">
    <text x="64" y="308" font-size="15" fill="#97917f">Who can change your vault's code</text>
    <text x="456" y="308">Nobody. An immutable clone — no</text>
    <text x="456" y="327">proxy, no owner. We cannot patch it.</text>
    <text x="820" y="308" fill="#97917f">A shared beacon: one owner, every</text>
    <text x="820" y="327" fill="#97917f">live vault at once. Renouncing it is</text>
    <text x="820" y="346" fill="#97917f">possible, not done.</text>
    <text x="64" y="387" font-size="15" fill="#97917f">What a share measures</text>
    <text x="456" y="387">Time held. ∫ balance dt / L over</text>
    <text x="456" y="406">the whole 30-minute epoch.</text>
    <text x="820" y="387" fill="#97917f">The balance at the instant a round</text>
    <text x="820" y="406" fill="#97917f">opens. One moment.</text>
    <text x="64" y="447" font-size="15" fill="#97917f">What the fee buys</text>
    <text x="456" y="447">A basket of 2 to 8 stocks, weights</text>
    <text x="456" y="466">in bps. A halted one is skipped.</text>
    <text x="820" y="447" fill="#97917f">One stock, picked at launch.</text>
    <text x="64" y="507" font-size="15" fill="#97917f">An unclaimed share</text>
    <text x="456" y="507">Cumulative, never expires, and</text>
    <text x="456" y="526">pushed to you at about $10.</text>
    <text x="820" y="507" fill="#97917f">Claimable for a fixed window, then</text>
    <text x="820" y="526" fill="#97917f">it rolls into the next round.</text>
    <text x="64" y="567" font-size="15" fill="#97917f">Where the lottery gets its number</text>
    <text x="456" y="567">A drand beacon verified on-chain.</text>
    <text x="456" y="586">It does not exist when tickets close.</text>
    <text x="820" y="567" fill="#97917f">Commit–reveal.</text>
  </g>

  <path d="M64 600 H1136" stroke="#2c2a24" stroke-width="1"/>
  <text x="64" y="622" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#ccff00">paydprotocol.eth</text>
  <text x="1136" y="622" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13"
        letter-spacing="1.1" fill="#97917f">EVERY PONSVAULT LINE READ ON PONSVAULT.COM/DOCS, 28 SEP 2026</text>
</svg>
