<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="Payd against PonsVault, read 28 September 2026. Who can change your vault's code: on Payd nobody, the vault is an immutable clone with no proxy and no owner, and Payd itself cannot patch it; on PonsVault a shared beacon lets one owner replace the code in every live vault at once, and renouncing that power is possible but not done. What a share measures: on Payd the time held, the integral of balance over the whole 30-minute epoch; on PonsVault the balance at the instant a round opens. What the fee buys: on Payd a basket of 2 to 8 stocks weighted in basis points, a halted one skipped; on PonsVault one stock picked at launch. An unclaimed share: on Payd cumulative, never expiring, pushed to the holder at about ten dollars; on PonsVault claimable for a fixed window, then it rolls into the next round. Where the lottery gets its number: on Payd a drand beacon verified on-chain that does not exist when tickets close; on PonsVault commit and reveal.">
  <rect width="1200" height="630" fill="#14130f"/>

